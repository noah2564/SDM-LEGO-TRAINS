# Mosquitto configuration for the LEGO train control system.
#
# DEVELOPMENT / TRUSTED LAN CONFIGURATION.
# Anonymous access is enabled below so the stack works immediately after a
# clone. That is acceptable on a home layout network and nowhere else. See
# "Turning on authentication" in README.md before putting this on a network
# you share with anything you do not control, and never forward port 1883 to
# the internet.

# ---------------------------------------------------------------- persistence
# Retained messages (each train's status topic) and queued QoS 1 messages
# survive a broker restart because this directory is a Docker volume.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# -------------------------------------------------------------------- logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
# Uncomment while debugging topic routing - very chatty:
# log_type debug
connection_messages true
log_timestamp true

# ------------------------------------------------------------------ listeners
# Plain MQTT for Pico W devices and the backend, on the Docker network and
# the host LAN.
# No bind address: listens on every interface, IPv4 and IPv6. Restrict it to
# a specific address here if the host is on more than one network.
listener 1883
protocol mqtt

# WebSocket listener. Not used by the frontend (which never speaks MQTT), but
# handy for debugging with MQTT Explorer or mqttx in a browser.
listener 9001
protocol websockets

# ------------------------------------------------------------------- security
# Development default: no credentials required.
allow_anonymous true

# --- Turning on authentication -------------------------------------------
# 1. Create the password file (see README.md):
#      docker compose exec mosquitto mosquitto_passwd -c -b \
#        /mosquitto/config/passwd backend "a-strong-password"
#      docker compose exec mosquitto mosquitto_passwd -b \
#        /mosquitto/config/passwd pico "another-password"
# 2. Set allow_anonymous to false and uncomment the two lines below.
# 3. Put MQTT_USERNAME / MQTT_PASSWORD in .env and in the Pico's config.py.
#
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/aclfile

# ------------------------------------------------------------------------ TLS
# To enable TLS later, add a second listener rather than changing the one
# above, so devices can be migrated one at a time. Nothing in the backend or
# the firmware needs to change beyond port, certificate path and ssl_params.
#
# listener 8883 0.0.0.0
# protocol mqtt
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# require_certificate false
# tls_version tlsv1.2

# -------------------------------------------------------------------- limits
# A train fleet is small and its messages are tiny; these caps keep a
# misbehaving device from exhausting the broker.
max_packet_size 8192
max_queued_messages 200
max_keepalive 120
