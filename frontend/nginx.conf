# Serves the static UI and reverse-proxies the API and WebSocket to the
# backend, so the browser talks to a single origin and no CORS is involved.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The UI is small and changes with each deploy: never cache the shell.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /ws {
        proxy_pass         http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        # Long timeout: the socket is idle between train movements.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /docs      { proxy_pass http://backend:8000/docs; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   512;
}
